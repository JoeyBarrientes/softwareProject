<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="description" content="Labs - Design Studio">
	<meta name="keywords" content="candy, e-commerce, creative, html">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Sugar Rush Candy Shop - Login</title>
	<!-- Favicon -->
	<link href="img/favicon.ico" rel="shortcut icon"/>

	<!-- Google Fonts -->
	<link href="https://fonts.googleapis.com/css?family=Oswald:300,400,500,700|Roboto:300,400,700" rel="stylesheet">

	<!-- Stylesheets -->
	<!-- Django Static -->
	{% load static %}
	<link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}"/>
	<link rel="stylesheet" href="{% static 'css/font-awesome.min.css' %}"/>
	<link rel="stylesheet" href="{% static 'css/flaticon.css' %}"/>
	<link rel="stylesheet" href="{% static 'css/magnific-popup.css' %}"/>
	<link rel="stylesheet" href="{% static 'css/owl.carousel.css' %}"/>
	<link rel="stylesheet" href="{% static 'css/style.css' %}"/>

    <!-- Without Django -->
    <!-- <link rel="stylesheet" href="/homePage/static/css/bootstrap.min.css"/>
	<link rel="stylesheet" href="/homePage/static/css/font-awesome.min.css"/>
	<link rel="stylesheet" href="/homePage/static/css/flaticon.css"/>
	<link rel="stylesheet" href="/homePage/static/css/magnific-popup.css"/>
	<link rel="stylesheet" href="/homePage/static/css/owl.carousel.css"/>
	<link rel="stylesheet" href="/homePage/static/css/style.css"/> -->


	<!--[if lt IE 9]>
	  <script src="https://oss.maxcdn.com/html5shiv/3.7.2/html5shiv.min.js"></script>
	  <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
	<![endif]-->

</head>
<body>
	
    <!-- Header section -->
    <header class="header-section">
        <div class="navbar">
            <!-- Logo -->
            <div class="logo">
                <img src="assets/img/logo.png" alt="">
            </div>

            <!-- Search -->
            <div class="search-bar">
                <form action="#">
                    <input type="text" placeholder="Search...">
                    <button type="submit" title="Search"><i class="flaticon-search"></i>Search</button>
                    <!-- <button>Search</button> -->

                </form>
            </div>

            <!-- Navigation -->
            <nav>
                <ul class="menu-list">
                    <li class="active"><a href="{% url 'home'%}">Home</a></li>
                    <li><a href="{% url 'products'%}">Products</a></li>
                    <li><a href="{% url 'cart'%}">Cart</a></li>
                    <li><a href="{% url 'login'%}">Login</a></li>
                </ul>
            </nav>
        </div>



    </header>
    <!-- Header section end -->
    

    <!-- About section -->
	<div class="about-section">
		
		<!-- card section end-->


		<!-- About content -->
		<div class="about-contant">
			<div class="container">
				<div class="section-title">
					<h2><span>Login</span></h2>
				</div>
				<div class="hero-center">
					<div class="col-md-12 text-center">
						<p class="font">*Indicates required field</p>
					</div>
				</div>
			</div>
		</div>
		<!--
		<div class="form-container">
			<div class="input-group mb-3">
				<span class="input-group-text" id="inputGroup-sizing-default">Username*</span>
				<input type="text" class="form-control" aria-label="Sizing example input" aria-describedby="inputGroup-sizing-default">
			</div>
			<div class="input-group mb-3">
				<span class="input-group-text" id="inputGroup-sizing-default">Password*</span>
				<input type="text" class="form-control" aria-label="Sizing example input" aria-describedby="inputGroup-sizing-default">
			</div>
		</div>
		-->
		<form method="post">
			{% csrf_token %}
			<input type="text" name="username" placeholder="Username" required>
			<input type="password" name="password" placeholder="Password" required>
			<button type="submit">Login</button>
			{% if error %}<p style="color:red;">{{ error }}</p>{% endif %}
		  </form>
    </div>
	<!-- About section end -->

    
    <!-- Footer section -->
    <footer>
        <div class="footer-content">
            <div class="icon-circle">
                <span>||</span>
            </div>
            <h2 class="footer-logo">SUGAR RUSH</h2>
            <nav class="footer-links">
                <a href="#">Home</a>
                <a href="#">Products</a>
                <a href="#">Cart</a>
                <a href="#">Login</a>
            </nav>
            <span class="footer-text">2025 All rights reserved.</span>
        </div>
    </footer>
    <!-- Footer section end -->
	
	<!--====== Javascripts & Jquery ======-->
	<script src="{% static 'js/jquery-2.1.4.min.js' %}"></script>
	<script src="{% static 'js/bootstrap.min.js' %}"></script>
	<script src="{% static 'js/magnific-popup.min.js' %}"></script>
	<script src="{% static 'js/owl.carousel.min.js' %}"></script>
	<script src="{% static 'js/circle-progress.min.js' %}"></script>
	<script src="{% static 'js/main.js' %}"></script>

    </body>	
</html>
